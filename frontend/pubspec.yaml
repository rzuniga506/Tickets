name: tickets_app
description: Sistema de Tickets de Soporte e Inventario de TI - Frontend Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.4.0
  retrofit: ^4.0.3
  pretty_dio_logger: ^1.3.1

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # Forms & Validation
  formz: ^0.6.1
  mask_text_input_formatter: ^2.7.0

  # Date & Time
  intl: ^0.18.1
  timeago: ^3.6.0

  # QR Code
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^3.5.5

  # Utilities
  get_it: ^7.6.4
  injectable: ^2.3.2
  logger: ^2.0.2+1
  path_provider: ^2.1.1
  url_launcher: ^6.2.2

  # Icons
  font_awesome_flutter: ^10.6.0

  # Charts & Analytics
  fl_chart: ^0.65.0

  # Notifications
  flutter_local_notifications: ^16.3.0
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9

  # Image Picker
  image_picker: ^1.0.7
  file_picker: ^6.1.1

  # Pull to Refresh
  pull_to_refresh: ^2.0.0

  # Responsive
  flutter_screenutil: ^5.9.0

  # Animation
  animate_do: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  retrofit_generator: ^8.0.6
  injectable_generator: ^2.4.1
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

